# =============================================================================
# SmartHotel-PMS — post-merge pipeline (Phase 12).
# Triggered on every push to main: builds images, runs compose integration,
# Playwright E2E smoke, and k6 smoke thresholds.
# =============================================================================
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & push container images to GHCR
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: pms-core
            context: services/pms-core
            image: ghcr.io/${{ github.repository }}/pms-core
          - service: pricing-service
            context: services/pricing-service
            image: ghcr.io/${{ github.repository }}/pricing-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2. Full test suite (mirrors pr.yml but unconditional)
  # ---------------------------------------------------------------------------
  java:
    name: backend-java (pms-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/pms-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/pms-core/pom.xml
      - name: Unit + IT + Checkstyle + SpotBugs + JaCoCo gate
        run: sh ./mvnw -B -ntp verify
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pms-core-reports
          path: |
            services/pms-core/target/failsafe-reports/
            services/pms-core/target/surefire-reports/
            services/pms-core/target/site/jacoco/
          if-no-files-found: warn

  python:
    name: pricing-service (tests + ML gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pricing-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pricing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/pricing-service/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint + format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (exclude slow/external)
        run: uv run pytest -q -m "not integration and not benchmark and not external"
      - name: OpenAPI drift check
        run: |
          uv run python -m app.export_openapi ../../docs/api/pricing-openapi.json
          git diff --exit-code -- ../../docs/api/pricing-openapi.json
      - name: Schemathesis fuzz
        run: uv run pytest -q tests/api/test_schemathesis.py
      - name: ML metric regression gate
        run: |
          uv run python -m datagen run --config datagen/configs/default.yaml --output ../../tmp/ml-gate-dataset
          uv run python -m ml.gate --dataset ../../tmp/ml-gate-dataset/snapshots.parquet --output ../../tmp/ml-gate

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ---------------------------------------------------------------------------
  # 3. Compose integration (reuses integration.yml logic inline)
  # ---------------------------------------------------------------------------
  compose-integration:
    name: Compose integration + fallback
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-jwt-secret-key-at-least-32-bytes-long!!/' .env
      - name: Build and start app stack
        run: |
          docker compose --env-file .env -f infra/compose.yml --profile app up -d --build --wait
          docker compose --env-file .env -f infra/compose.yml --profile app ps
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/actuator/health/readiness >/dev/null \
              && curl -sf http://127.0.0.1:8081/health/ready >/dev/null; then
              echo "Both services ready"
              exit 0
            fi
            sleep 5
          done
          echo "Services not ready in time"
          docker compose --env-file .env -f infra/compose.yml --profile app logs --tail=200
          exit 1
      - name: Admin login + refresh rate calendar
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@smarthotel.local","password":"admin-dev-password"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          curl -sf -X POST http://127.0.0.1:8080/api/v1/admin/pricing/refresh \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["status"]=="OK"; assert d["daysUpdated"]>0'
      - name: Stop pricing and book with fallback
        run: |
          set -euo pipefail
          docker stop smarthotel-pricing || true
          CHECK_IN=$(date -u -d '+45 days' +%F)
          CHECK_OUT=$(date -u -d '+47 days' +%F)
          RESP=$(curl -s -o /tmp/booking.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/reservations \
            -H 'Content-Type: application/json' \
            -d "{\"roomTypeCode\":\"STD\",\"ratePlanCode\":\"FLEX\",\"checkIn\":\"$CHECK_IN\",\"checkOut\":\"$CHECK_OUT\",\"adults\":2,\"guest\":{\"email\":\"ci-fallback@example.com\",\"firstName\":\"Ci\",\"lastName\":\"Fallback\"}}")
          echo "HTTP $RESP"
          cat /tmp/booking.json
          test "$RESP" = "201"
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yml --profile app logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infra/compose.yml --profile app down -v

  # ---------------------------------------------------------------------------
  # 4. Playwright E2E smoke (3-scenario subset, Phase 9+)
  # ---------------------------------------------------------------------------
  e2e-smoke:
    name: E2E smoke (Playwright)
    needs: [compose-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: hashFiles('e2e/playwright.config.ts') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-jwt-secret-key-at-least-32-bytes-long!!/' .env
      - name: Start app stack
        run: |
          docker compose --env-file .env -f infra/compose.yml --profile app up -d --build --wait
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install E2E deps
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run E2E smoke
        working-directory: e2e
        run: pnpm exec playwright test --grep @smoke
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-traces
          path: e2e/test-results/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infra/compose.yml --profile app down -v

  # ---------------------------------------------------------------------------
  # 5. k6 smoke (Phase 11+)
  # ---------------------------------------------------------------------------
  k6-smoke:
    name: k6 smoke thresholds
    needs: [compose-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: hashFiles('perf/smoke.js') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-jwt-secret-key-at-least-32-bytes-long!!/' .env
      - name: Start app stack
        run: |
          docker compose --env-file .env -f infra/compose.yml --profile app up -d --build --wait
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke
        run: k6 run perf/smoke.js
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infra/compose.yml --profile app down -v

  # ---------------------------------------------------------------------------
  # Aggregate gate
  # ---------------------------------------------------------------------------
  main-ok:
    name: Main OK
    needs: [build-images, java, python, frontend, compose-integration, e2e-smoke, k6-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All checks passed
        run: echo "Main pipeline OK"
