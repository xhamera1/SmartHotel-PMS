# =============================================================================
# SmartHotel-PMS — incremental CI (Phase 1 database checks).
# Java runs Flyway/constraint integration tests; Python runs lint and migrations.
# The frontend placeholder fails when its scaffold appears without real checks.
# "CI OK" aggregates all applicable jobs.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'services/pms-core/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            python:
              - 'services/pricing-service/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'Taskfile.yml'
              - '.env.example'
              - '.github/workflows/**'

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce declared line endings (see DEF-0001 and DEF-0004)
        run: |
          bad=$(git ls-files --eol | awk '$1 == "i/mixed" || ($1 == "i/crlf" && $0 !~ /attr\/text eol=crlf/)')
          if [ -n "$bad" ]; then
            echo "::error::Unexpected CRLF or mixed line endings (violates .gitattributes):"
            echo "$bad"
            exit 1
          fi
          echo "Line endings OK."

  java:
    name: pms-core (migrations + constraints)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pms-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/pms-core/pom.xml
      - name: Flyway migrations and reservation constraints (PostgreSQL 17 / Testcontainers)
        run: sh ./mvnw -B -ntp verify
      - name: Publish Java test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-core-test-reports
          path: |
            services/pms-core/target/failsafe-reports/
            services/pms-core/target/surefire-reports/
          if-no-files-found: warn

  python:
    name: pricing-service (lint + migrations)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pricing-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pricing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/pricing-service/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Migrations — upgrade, idempotent re-run, downgrade, re-upgrade
        env:
          PRICING_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/pricing_ci
        run: |
          uv run alembic upgrade head
          uv run alembic upgrade head    # must be a no-op, not an error
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Assert schema contents
        env:
          PRICING_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/pricing_ci
        run: |
          uv run python -c '
          import os, sqlalchemy as sa
          engine = sa.create_engine(os.environ["PRICING_DATABASE_URL"])
          query = sa.text("SELECT table_name FROM information_schema.tables WHERE table_schema = :s")
          with engine.connect() as conn:
              tables = {r[0] for r in conn.execute(query, {"s": "pricing"})}
          expected = {"alembic_version", "events", "event_scores", "daily_demand", "model_registry", "prediction_log"}
          missing = expected - tables
          assert not missing, f"missing tables: {missing}"
          print("pricing schema OK:", sorted(tables))
          '

  frontend:
    name: frontend (lint)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint & format (placeholder until the Phase 3 scaffold)
        run: |
          if [ -f frontend/package.json ]; then
            echo "::error::frontend is scaffolded but CI is still a placeholder — wire the real steps (plan Phase 3: pnpm lint, tsc --noEmit, vitest run --coverage, build)."
            exit 1
          fi
          echo "frontend not scaffolded yet (Phase 3) — placeholder passes."

  infra:
    name: infra (compose lint)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yml config --quiet
          echo "Compose config OK."

  ci-ok:
    name: CI OK
    needs: [changes, hygiene, java, python, frontend, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All applicable checks passed
        run: echo "CI OK"
