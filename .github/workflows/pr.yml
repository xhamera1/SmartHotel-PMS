# =============================================================================
# SmartHotel-PMS — PR pipeline (Phase 0.5 bootstrap).
# Placeholder jobs (java/python/frontend) are self-enforcing: they PASS while a
# component is not scaffolded, and FAIL loudly the moment its marker file exists
# without the real lint/test steps being wired in — placeholders cannot rot.
# "CI OK" is the single required status for branch protection.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'services/pms-core/**'
            python:
              - 'services/pricing-service/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'Taskfile.yml'
              - '.env.example'
              - '.github/workflows/**'

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No CRLF/mixed line endings committed (see DEF-0001)
        run: |
          bad=$(git ls-files --eol | grep -E 'i/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files committed with CRLF/mixed endings (violates .gitattributes):"
            echo "$bad"
            exit 1
          fi
          echo "Line endings OK."

  java:
    name: pms-core (lint)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint & format (placeholder until the Phase 2 scaffold)
        run: |
          if [ -f services/pms-core/pom.xml ]; then
            echo "::error::pms-core is scaffolded but CI is still a placeholder — wire the real steps (plan Phase 2: ./mvnw -B verify with Checkstyle/SpotBugs + JaCoCo gate)."
            exit 1
          fi
          echo "pms-core not scaffolded yet (Phase 2) — placeholder passes."

  python:
    name: pricing-service (lint + migrations)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pricing-service
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pricing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/pricing-service/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Migrations — upgrade, idempotent re-run, downgrade, re-upgrade
        env:
          PRICING_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/pricing_ci
        run: |
          uv run alembic upgrade head
          uv run alembic upgrade head    # must be a no-op, not an error
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Assert schema contents
        env:
          PRICING_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/pricing_ci
        run: |
          uv run python -c '
          import os, sqlalchemy as sa
          engine = sa.create_engine(os.environ["PRICING_DATABASE_URL"])
          query = sa.text("SELECT table_name FROM information_schema.tables WHERE table_schema = :s")
          with engine.connect() as conn:
              tables = {r[0] for r in conn.execute(query, {"s": "pricing"})}
          expected = {"alembic_version", "events", "event_scores", "daily_demand", "model_registry", "prediction_log"}
          missing = expected - tables
          assert not missing, f"missing tables: {missing}"
          print("pricing schema OK:", sorted(tables))
          '

  frontend:
    name: frontend (lint)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint & format (placeholder until the Phase 3 scaffold)
        run: |
          if [ -f frontend/package.json ]; then
            echo "::error::frontend is scaffolded but CI is still a placeholder — wire the real steps (plan Phase 3: pnpm lint, tsc --noEmit, vitest run --coverage, build)."
            exit 1
          fi
          echo "frontend not scaffolded yet (Phase 3) — placeholder passes."

  infra:
    name: infra (compose lint)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yml config --quiet
          echo "Compose config OK."

  ci-ok:
    name: CI OK
    needs: [changes, hygiene, java, python, frontend, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All applicable checks passed
        run: echo "CI OK"
