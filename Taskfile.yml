# =============================================================================
# SmartHotel-PMS — task runner (https://taskfile.dev), Phase 0.2
#
# Cross-platform by design: go-task executes commands with its built-in POSIX
# shell (mvdan/sh), so the same tasks run on Windows, WSL2, macOS, and Linux CI.
# Aggregate tasks (lint, test, seed) gain component subtasks as phases land
# (Java in Phase 2, frontend in Phase 3, Python in Phase 4+).
#
# Usage:  task            → list tasks
#         task up         → start dev infrastructure (PostgreSQL, healthy)
#         task smoke      → up + database smoke checks
# =============================================================================
version: '3'

dotenv: ['.env']

vars:
  COMPOSE: docker compose --env-file .env -f infra/compose.yml

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  env:
    desc: Create .env from .env.example (skipped when .env already exists)
    status:
      - test -f .env
    cmds:
      - cmd: powershell -NoProfile -Command "Copy-Item .env.example .env"
        platforms: [windows]
      - cmd: cp .env.example .env
        platforms: [linux, darwin]

  up:
    desc: Start core infrastructure (PostgreSQL) and wait until healthy
    deps: [env]
    cmds:
      - '{{.COMPOSE}} --profile core up -d --wait'

  down:
    desc: Stop core infrastructure (the data volume is preserved)
    cmds:
      - '{{.COMPOSE}} --profile core down'

  db-reset:
    desc: Destroy the database volume and re-run the first-time init scripts
    prompt: This wipes ALL local database data. Continue?
    cmds:
      - '{{.COMPOSE}} --profile core down --volumes'
      - task: up

  smoke:
    desc: Verify database health, schemas, service users, and btree_gist
    deps: [up]
    cmds:
      - docker exec -i smarthotel-postgres psql -U postgres -d smarthotel -v ON_ERROR_STOP=1 -f - < infra/postgres/smoke.sql

  lint:
    desc: Run all linters (aggregate — components register in later phases)
    cmds:
      - task: lint:infra
      - task: lint:python

  lint:infra:
    desc: Validate the Docker Compose configuration
    deps: [env]
    cmds:
      - '{{.COMPOSE}} config --quiet'
      - cmd: echo "compose config OK"
        silent: true

  lint:python:
    desc: Ruff lint + format check (pricing-service)
    dir: services/pricing-service
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  db-migrate:pricing:
    desc: Apply pricing-schema Alembic migrations to the dev database
    deps: [up]
    dir: services/pricing-service
    cmds:
      - uv run alembic upgrade head

  test:
    desc: Run all test suites (aggregate — components register in later phases)
    cmds:
      - task: smoke

  seed:
    desc: Apply pms schema + dev seeds to the dev database (interim, until the Phase 2 app runs Flyway itself)
    deps: [up]
    cmds:
      # NOTE: applies the Flyway SQL manually (no flyway_schema_history). Before the
      # first pms-core application start (Phase 2), run `task db-reset` so Flyway
      # can take ownership of the pms schema from scratch.
      - docker exec -i smarthotel-postgres psql -q -U postgres -d smarthotel -v ON_ERROR_STOP=1 -f - < services/pms-core/src/main/resources/db/migration/V1__baseline.sql
      - docker exec -i smarthotel-postgres psql -q -U postgres -d smarthotel -v ON_ERROR_STOP=1 -f - < services/pms-core/src/main/resources/db/seed/V2__seed_reference_data.sql
      - cmd: echo "pms schema + dev seeds applied (3 room types, 35 rooms, 3 rate plans, 2 staff users)"
        silent: true
