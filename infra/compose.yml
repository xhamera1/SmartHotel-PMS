# =============================================================================
# SmartHotel-PMS — runtime infrastructure (implementation plan §4.4, Phase 0.4)
#
# Profiles (plan §4.4):
#   core          → PostgreSQL only (backend development from the IDE)
#   app           → full stack (services join in Phases 2–8)
#   stubs         → WireMock stand-ins for Ticketmaster/Gemini (Phase 7+)
#   observability → Elasticsearch + Kibana + Filebeat (Phase 10)
#
# Usage (from the repository root; Taskfile targets will wrap these later):
#   docker compose --env-file .env -f infra/compose.yml --profile core up -d --wait
#   docker compose --env-file .env -f infra/compose.yml --profile core down
#
# The postgres init scripts run ONLY on first initialization of an empty data
# volume. To re-run them from scratch:
#   docker compose --env-file .env -f infra/compose.yml --profile core down --volumes
# =============================================================================
name: smarthotel

services:
  postgres:
    image: postgres:17
    container_name: smarthotel-postgres
    profiles: ["core", "app"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthotel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Consumed by postgres/init/01-init.sh on first run:
      PMS_DB_PASSWORD: ${PMS_DB_PASSWORD:?PMS_DB_PASSWORD must be set in .env}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:?PRICING_DB_PASSWORD must be set in .env}
      # The database server deliberately stays on UTC (plan D16): audit
      # timestamps are timestamptz (UTC), business dates are plain DATE.
      # Application containers get TZ=Europe/Warsaw instead.
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container shell (container env, not .env).
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_LOCALE: ${VITE_LOCALE:-pl-PL}
    container_name: smarthotel-frontend
    profiles: ["app"]
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    depends_on:
      pms-core:
        condition: service_healthy
    restart: unless-stopped

  wiremock:
    image: wiremock/wiremock:3.12.1
    container_name: smarthotel-wiremock
    profiles: ["stubs"]
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${WIREMOCK_HOST_PORT:-8089}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: smarthotel-elasticsearch
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: smarthotel-kibana
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.3
    container_name: smarthotel-filebeat
    profiles: ["observability"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  pms-core:
    build:
      context: ../services/pms-core
      dockerfile: Dockerfile
    container_name: smarthotel-pms
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthotel}?currentSchema=pms
      SPRING_DATASOURCE_USERNAME: pms_user
      SPRING_DATASOURCE_PASSWORD: ${PMS_DB_PASSWORD:-pms-dev-password}
      JWT_SECRET: ${JWT_SECRET:-change-me-generate-a-256-bit-secret-min-32-chars}
      PRICING_BASE_URL: http://pricing-service:8081
      PRICING_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      PRICING_ENABLED: ${PRICING_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TZ: Europe/Warsaw
    ports:
      - "${PMS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  pricing-service:
    build:
      context: ../services/pricing-service
      dockerfile: Dockerfile
    container_name: smarthotel-pricing
    profiles: ["app"]
    environment:
      PRICING_DATABASE_URL: postgresql+psycopg://pricing_user:${PRICING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthotel}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      MODEL_ARTIFACT_DIR: /app/fixtures/models/tiny
      ALLOW_FIXTURE_MODEL: "true"
      EVENT_PROVIDER: ${EVENT_PROVIDER:-static}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      HOTEL_LAT: ${HOTEL_LAT:-50.068369}
      HOTEL_LON: ${HOTEL_LON:-19.924854}
      EVENT_RADIUS_KM: ${EVENT_RADIUS_KM:-15}
      EVENT_HORIZON_DAYS: ${EVENT_HORIZON_DAYS:-365}
      TZ: Europe/Warsaw
    ports:
      - "${PRICING_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
    name: smarthotel-pgdata
  esdata:
    name: smarthotel-esdata
