# =============================================================================
# SmartHotel-PMS — runtime infrastructure (implementation plan §4.4, Phase 0.4)
#
# Profiles (plan §4.4):
#   core          → PostgreSQL only (backend development from the IDE)
#   app           → full stack (services join in Phases 2–8)
#   stubs         → WireMock stand-ins for Ticketmaster/Gemini (Phase 7+)
#   observability → Elasticsearch + Kibana + Filebeat (Phase 10)
#
# Usage (from the repository root; Taskfile targets will wrap these later):
#   docker compose --env-file .env -f infra/compose.yml --profile core up -d --wait
#   docker compose --env-file .env -f infra/compose.yml --profile core down
#
# The postgres init scripts run ONLY on first initialization of an empty data
# volume. To re-run them from scratch:
#   docker compose --env-file .env -f infra/compose.yml --profile core down --volumes
# =============================================================================
name: smarthotel

services:
  postgres:
    image: postgres:17
    container_name: smarthotel-postgres
    profiles: ["core", "app"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthotel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Consumed by postgres/init/01-init.sh on first run:
      PMS_DB_PASSWORD: ${PMS_DB_PASSWORD:?PMS_DB_PASSWORD must be set in .env}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:?PRICING_DB_PASSWORD must be set in .env}
      # The database server deliberately stays on UTC (plan D16): audit
      # timestamps are timestamptz (UTC), business dates are plain DATE.
      # Application containers get TZ=Europe/Warsaw instead.
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ defers expansion to the container shell (container env, not .env).
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Later phases register services here:
  #   pms-core (Phase 2+) — healthcheck: GET /actuator/health/readiness
  #     (liveness: /actuator/health/liveness · info: /actuator/info · UI: /swagger-ui)
  #   frontend (Phase 3)
  #   wiremock [stubs] (Phase 7) · elasticsearch/kibana/filebeat [observability] (Phase 10)

  pricing-service:
    build:
      context: ../services/pricing-service
      dockerfile: Dockerfile
    container_name: smarthotel-pricing
    profiles: ["app"]
    environment:
      PRICING_DATABASE_URL: postgresql+psycopg://pricing_user:${PRICING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthotel}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
      MODEL_ARTIFACT_DIR: /app/fixtures/models/tiny
      ALLOW_FIXTURE_MODEL: "true"
      EVENT_PROVIDER: ${EVENT_PROVIDER:-static}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      HOTEL_LAT: ${HOTEL_LAT:-50.068369}
      HOTEL_LON: ${HOTEL_LON:-19.924854}
      EVENT_RADIUS_KM: ${EVENT_RADIUS_KM:-15}
      EVENT_HORIZON_DAYS: ${EVENT_HORIZON_DAYS:-120}
      TZ: Europe/Warsaw
    ports:
      - "${PRICING_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
    name: smarthotel-pgdata
