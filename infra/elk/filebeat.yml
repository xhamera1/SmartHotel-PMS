# Ship pms-core + pricing-service JSON logs into smarthotel-*.
# Apps use businessEvent (not ECS object `event`). Docker metadata is dropped
# because container.image is an object and fights our keyword mapping.
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: false
      templates:
        - condition:
            or:
              - contains.docker.container.name: smarthotel-pms
              - contains.docker.container.name: smarthotel-pricing
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log

processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true
  - copy_fields:
      fields:
        - from: container.name
          to: containerName
      fail_on_error: false
      ignore_missing: true
  - drop_fields:
      fields:
        - agent
        - ecs
        - host
        - input
        - log
        - stream
        - container
        - docker
        - orchestrator
        - cloud
      ignore_missing: true
  - drop_event:
      when:
        not:
          has_fields: ["service"]

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "smarthotel-%{+yyyy.MM.dd}"

logging.level: info
