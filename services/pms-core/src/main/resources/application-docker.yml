# Docker Compose profile for pms-core (infra/compose.yml profile "app").
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    schemas: pms
    default-schema: pms
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pms
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  hotel:
    zone: Europe/Warsaw
  pricing:
    enabled: ${PRICING_ENABLED:true}
    base-url: ${PRICING_BASE_URL:http://pricing-service:8081}
    api-key: ${PRICING_API_KEY}
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: warn
