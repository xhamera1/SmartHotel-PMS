spring:
  application:
    name: pms-core
  profiles:
    default: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterWrite=5m

server:
  port: ${PMS_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false

info:
  app:
    name: ${spring.application.name}
    description: SmartHotel PMS Core
    version: 0.1.0-SNAPSHOT

app:
  hotel:
    zone: Europe/Warsaw
  night-audit:
    cron: "0 5 0 * * *"
  rate-refresh:
    cron: "0 0 3 * * *"
  pricing:
    enabled: ${PRICING_ENABLED:true}
    base-url: ${PRICING_BASE_URL:http://localhost:8081}
    api-key: ${PRICING_API_KEY:dev-internal-api-key}
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
    batch-read-timeout-ms: 10000
    refresh-horizon-days: 180
    refresh-chunk-size: 366
    on-demand-timeout-ms: 2000
  jwt:
    secret: ${JWT_SECRET:change-me-generate-a-256-bit-secret-min-32-chars}
    access-token-ttl: 3600
    refresh-token-ttl: 86400
  auth:
    login-rate-limit:
      capacity: 10
      window: PT1M
    refresh-cookie:
      name: pms_refresh
      path: /api/v1/auth
      same-site: Strict
      secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resilience4j:
  retry:
    instances:
      pricing:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      pricing:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      pricing:
        timeout-duration: 3s
      pricing-on-demand:
        timeout-duration: 2s

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:},%X{requestId:-}] %logger{36} : %m%n"
