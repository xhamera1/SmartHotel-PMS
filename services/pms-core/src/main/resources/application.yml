spring:
  application:
    name: pms-core
  profiles:
    default: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PMS_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false

info:
  app:
    name: ${spring.application.name}
    description: SmartHotel PMS Core
    version: 0.1.0-SNAPSHOT

app:
  hotel:
    zone: Europe/Warsaw
  night-audit:
    cron: "0 5 0 * * *"
  jwt:
    secret: ${JWT_SECRET:change-me-generate-a-256-bit-secret-min-32-chars}
    access-token-ttl: 3600
    refresh-token-ttl: 86400
  auth:
    login-rate-limit:
      capacity: 10
      window: PT1M
    refresh-cookie:
      name: pms_refresh
      path: /api/v1/auth
      same-site: Strict
      secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:},%X{requestId:-}] %logger{36} : %m%n"
