[project]
name = "pricing-service"
version = "0.1.0"
description = "SmartHotel dynamic pricing microservice - owns the `pricing` PostgreSQL schema via Alembic; FastAPI app, ML pipeline and event intelligence arrive in later phases"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "numpy>=2.5.3",
    "holidays>=0.104",
    "pandera>=0.33.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.7.2,<1.8",
    "joblib>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.0",
    "ruff>=0.12",
    "schemathesis>=3.0",
    "testcontainers[postgres]>=4.0",
    "respx>=0.22",
]

# Not an installable package (yet) - uv manages the environment only.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Colab demos embed long JSON fixtures and exploratory imports — not production code.
exclude = ["notebooks"]

[tool.ruff.format]
exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends/Query in defaults is the idiomatic pattern.
"app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require Docker/testcontainers",
    "benchmark: informational performance benchmarks",
    "external: tests requiring real external API keys (Ticketmaster, Gemini)",
]
